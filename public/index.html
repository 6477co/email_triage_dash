<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox triage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f1218; --panel:#161b23; --panel-2:#1c222c;
    --line:#28303d; --line-soft:#20272f;
    --text:#e6eaf1; --text-dim:#96a0b1; --text-faint:#5f6a7b;
    --p0:#ff5247; --p1:#f2a63b; --go:#54c9a8;
    --sans:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible,textarea:focus-visible{outline:2px solid var(--go);outline-offset:2px}
  a{color:var(--go)}

  .app{display:grid;grid-template-rows:auto 1fr;height:100vh}
  header.bar{display:flex;align-items:baseline;gap:20px;padding:14px 22px;
    border-bottom:1px solid var(--line);background:var(--panel)}
  .brand{font-weight:700;letter-spacing:-.01em}
  .brand span{color:var(--text-faint);font-weight:400}
  .counts{margin-left:auto;display:flex;gap:18px;font-family:var(--mono);font-size:12px;color:var(--text-dim)}
  .counts b{color:var(--text);font-weight:600}
  .dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;transform:translateY(-1px)}

  .body{display:grid;grid-template-columns:64px minmax(0,1fr) 208px;min-height:0}

  .spine{border-right:1px solid var(--line);background:var(--panel);padding:16px 0;
    display:flex;flex-direction:column;align-items:center;gap:5px;overflow:hidden}
  .spine .label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;
    color:var(--text-faint);writing-mode:vertical-rl;margin-bottom:10px}
  .rung{width:22px;height:6px;border-radius:1px;background:var(--line);
    transition:width .18s ease,opacity .3s ease}
  .rung.p0{background:var(--p0);opacity:.5}
  .rung.p1{background:var(--p1);opacity:.5}
  .rung.now{width:38px;opacity:1;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
  .rung.done{opacity:.12;width:12px}
  .spine .depth{margin-top:auto;font-family:var(--mono);font-size:11px;color:var(--text-faint)}

  .reader{display:flex;flex-direction:column;min-height:0;min-width:0}
  .meta{padding:20px 30px 16px;border-bottom:1px solid var(--line-soft)}
  .tagrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .tag{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;padding:3px 7px;border-radius:2px}
  .tag.p0{background:rgba(255,82,71,.14);color:var(--p0);border:1px solid rgba(255,82,71,.3)}
  .tag.p1{background:rgba(242,166,59,.13);color:var(--p1);border:1px solid rgba(242,166,59,.28)}
  .tag.none{background:var(--panel-2);color:var(--text-faint);border:1px solid var(--line)}
  .tag.cat{background:none;color:var(--text-faint);border:1px solid var(--line)}
  .when{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-faint)}
  h1.subject{font-size:21px;line-height:1.3;margin:0 0 8px;font-weight:600;letter-spacing:-.015em}
  .from{font-family:var(--mono);font-size:12.5px;color:var(--text-dim)}
  .from b{color:var(--text);font-weight:500}
  .from a{float:right;font-size:11px}

  .msg{padding:24px 30px 30px;overflow-y:auto;flex:1;min-height:0;font-size:15px;color:#d5dbe5;max-width:74ch}
  .msg p{margin:0 0 15px;white-space:pre-wrap}
  .msg .sys{font-family:var(--mono);font-size:12px;color:var(--text-faint)}

  .composer{border-top:1px solid var(--line);background:var(--panel);padding:14px 30px 18px}
  .composer .head{display:flex;align-items:center;gap:8px;margin-bottom:10px;
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--text-faint)}
  .chip{font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:3px;
    border:1px solid var(--line);color:var(--text-dim)}
  .chip:hover:not(:disabled){border-color:var(--go);color:var(--go)}
  textarea{width:100%;min-height:80px;resize:vertical;background:var(--ink);
    border:1px solid var(--line);border-radius:4px;padding:12px 14px;color:var(--text);
    font-family:var(--sans);font-size:14.5px;line-height:1.6}
  textarea::placeholder{color:var(--text-faint)}
  .send{display:flex;align-items:center;gap:12px;margin-top:10px}
  .send .primary{background:var(--go);color:#06231c;font-weight:600;font-size:13.5px;padding:8px 16px;border-radius:3px}
  .send .ghost{font-size:13px;color:var(--text-dim)}
  .send .ghost:hover{color:var(--text)}
  .send .hint{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-faint)}

  .actions{border-left:1px solid var(--line);background:var(--panel);padding:20px 16px;
    display:flex;flex-direction:column;gap:8px}
  .actions .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--text-faint);margin-bottom:6px}
  .act{display:flex;align-items:center;justify-content:space-between;width:100%;
    padding:11px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2);
    font-size:14px;font-weight:500;transition:border-color .14s,transform .08s,color .14s}
  .act kbd{font-family:var(--mono);font-size:10px;color:var(--text-faint);
    border:1px solid var(--line);border-radius:2px;padding:1px 5px}
  .act:hover:not(:disabled){border-color:var(--text-faint)}
  .act:active{transform:translateY(1px)}
  .act.archive:hover:not(:disabled){border-color:var(--go);color:var(--go)}
  .act.p1:hover:not(:disabled){border-color:var(--p1);color:var(--p1)}
  .actions .spacer{flex:1}
  .status{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);
    border-top:1px solid var(--line-soft);padding-top:12px;line-height:1.9}
  .status i{color:var(--text-dim);font-style:normal}
  .status .warn{color:var(--p1)}

  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;
    flex:1;gap:12px;color:var(--text-dim);text-align:center;padding:40px}
  .center b{font-size:19px;color:var(--text);font-weight:600}
  .center .sub{max-width:44ch;font-size:14px}
  .center .primary{background:var(--go);color:#06231c;font-weight:600;padding:9px 18px;border-radius:3px}
  .center .err{font-family:var(--mono);font-size:11.5px;color:var(--p0);max-width:60ch;word-break:break-word}
  .spin{width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--go);
    border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .flash{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel-2);
    border:1px solid var(--line);border-radius:4px;padding:9px 16px;font-family:var(--mono);
    font-size:12px;color:var(--text-dim);opacity:0;pointer-events:none;transition:opacity .2s;max-width:70vw}
  .flash.show{opacity:1;pointer-events:auto}

  @media (max-width:820px){
    .body{grid-template-columns:1fr;grid-template-rows:1fr auto}
    .spine{display:none}
    .actions{flex-direction:row;border-left:none;border-top:1px solid var(--line);align-items:center}
    .actions .cap,.actions .status{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">Inbox triage <span>/ gmail</span></div>
    <div class="counts">
      <div><span class="dot" style="background:var(--p0)"></span>P0 <b id="c0">–</b></div>
      <div><span class="dot" style="background:var(--p1)"></span>P1 <b id="c1">–</b></div>
      <div><span class="dot" style="background:var(--line)"></span>Rest <b id="cr">–</b></div>
      <div>Queue <b id="cq">–</b></div>
    </div>
  </header>

  <div class="body">
    <nav class="spine" aria-label="Queue depth">
      <div class="label">QUEUE</div>
      <div id="rungs" style="display:flex;flex-direction:column;gap:5px;align-items:center"></div>
      <div class="depth" id="depth">–</div>
    </nav>

    <main class="reader" id="reader"></main>

    <aside class="actions">
      <div class="cap">ACTION</div>
      <button class="act archive" id="bArchive" onclick="act('archive')">Archive <kbd>A</kbd></button>
      <button class="act" id="bSkip" onclick="act('skip')">Skip <kbd>S</kbd></button>
      <button class="act p1" id="bP1" onclick="act('p1')">Make P1 <kbd>P</kbd></button>
      <div class="spacer"></div>
      <div class="status">
        Batch <i id="batch">0</i><br>
        Loaded <i id="loaded">0</i> · Left <i id="left">0</i><br>
        Refill at <i>&lt;5</i><br>
        <span class="warn">Replies save to Drafts</span>
      </div>
    </aside>
  </div>
</div>
<div class="flash" id="flash"></div>

<script>
let BATCH = 10; const REFILL_AT = 5;

let queue = [], cur = 0, batch = 0, seen = new Set(), busy = false, loading = false, fatal = null;
const el = id => document.getElementById(id);

async function fetchAPI(endpoint, options = {}) {
  const res = await fetch(endpoint, {
    headers: { 'Content-Type': 'application/json', ...options.headers },
    ...options
  });
  if (res.status === 401) {
    window.location.href = '/auth/google';
    return;
  }
  if (!res.ok) throw new Error("API "+res.status+" — "+(await res.text()).slice(0,300));
  return res.json();
}

async function fetchBatch(){
  if(loading) return;
  loading = true; render();
  try{
    const exclude = [...seen];
    const data = await fetchAPI(`/api/threads?batch=${BATCH}&exclude=${encodeURIComponent(JSON.stringify(exclude))}`);
    const rows = data.rows || [];

    const fresh = rows
      .filter(r => r && r.threadId && !seen.has(r.threadId))
      .map(r => ({ ...r, ...classify(r.labels), dateLabel: fmtDate(r.dateISO) }));

    fresh.forEach(r => {
      seen.add(r.threadId);
      queue.push({ ...r, state:"open", body:null, reply:"" });
    });
    batch++;
    sortQueue();
    if(!fresh.length) flash("Nothing new in the inbox");
    else flash(`Loaded ${fresh.length}`);
  }catch(e){
    fatal = e.message;
  }finally{
    loading = false;
    if(!queue[cur] || queue[cur].state!=="open") cur = queue.findIndex(q=>q.state==="open");
    render();
    ensureBody();
  }
}

function classify(labels){
  const list = (Array.isArray(labels)?labels:[]).map(String);
  const hit = t => list.some(l => {
    const n = l.trim().toUpperCase();
    return n===t || n.endsWith("/"+t);
  });
  const SYS = new Set(["INBOX","UNREAD","STARRED","IMPORTANT","SENT","DRAFT","SPAM","TRASH","CATEGORY_PERSONAL",
    "CATEGORY_SOCIAL","CATEGORY_PROMOTIONS","CATEGORY_UPDATES","CATEGORY_FORUMS","P0","P1"]);
  const cat = list.map(l=>l.split("/").pop().trim())
                  .find(l => l && !SYS.has(l.toUpperCase())) || "";
  return { priority: hit("P0") ? "P0" : hit("P1") ? "P1" : null,
           category: cat.length>14 ? cat.slice(0,14) : cat };
}
function fmtDate(iso){
  const d = new Date(iso);
  if(isNaN(d)) return "";
  const now = new Date(), sameDay = d.toDateString()===now.toDateString();
  if(sameDay) return d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  const y = new Date(now); y.setDate(now.getDate()-1);
  if(d.toDateString()===y.toDateString()) return "Yesterday";
  return d.toLocaleDateString([], {month:"short", day:"numeric"});
}

function sortQueue(){
  const rank = p => p==="P0" ? 0 : p==="P1" ? 1 : 2;
  const id = queue[cur] && queue[cur].threadId;
  queue.sort((a,b)=> rank(a.priority)-rank(b.priority) || (b.dateISO||"").localeCompare(a.dateISO||""));
  if(id){ const i = queue.findIndex(q=>q.threadId===id); if(i>-1) cur = i; }
}

async function loadBody(m){
  if(m.body!==null || m.loadingBody) return;
  m.loadingBody = true;
  try{
    const data = await fetchAPI(`/api/thread/${m.threadId}`);
    m.body = data.body || "(empty message)";
    m.truncated = data.truncated || false;
  }catch(e){
    m.body = null; m.bodyError = e.message;
  }finally{
    m.loadingBody = false;
    if(queue[cur]===m) render();
  }
}
function ensureBody(){
  const m = queue[cur]; if(!m) return;
  loadBody(m);
  const next = queue.find((q,i)=>i>cur && q.state==="open");
  if(next) setTimeout(()=>loadBody(next), 400);
}

async function act(kind){
  const m = queue[cur]; if(!m || busy) return;
  if(kind==="skip"){ m.state="skipped"; flash("Skipped — left in inbox"); advance(); return; }

  const prev = m.state;
  m.state = "done";
  if(kind==="p1") m.priority = "P1";
  flash(kind==="archive" ? "Archiving…" : "Labeling P1…");
  advance();

  try{
    await fetchAPI(`/api/thread/${m.threadId}/action`, {
      method: 'POST',
      body: JSON.stringify({ action: kind })
    });
    flash(kind==="archive" ? "Archived" : "Labeled P1 and starred");
  }catch(e){
    m.state = prev;
    flash("Failed — restored to queue: "+e.message.slice(0,80));
    render();
  }
}

function advance(){
  let n = queue.findIndex((q,i)=>i>cur && q.state==="open");
  if(n===-1) n = queue.findIndex(q=>q.state==="open");
  cur = n===-1 ? queue.length : n;
  render();
  const open = queue.filter(q=>q.state==="open").length;
  if(open < REFILL_AT && !loading) fetchBatch(); else ensureBody();
}

async function draftReply(){
  const m = queue[cur]; if(!m || busy) return;
  busy = true; render();
  try{
    const data = await fetchAPI(`/api/thread/${m.threadId}/draft-ai`, {
      method: 'POST',
      body: JSON.stringify({ from: m.from, addr: m.addr, subject: m.subject, body: m.body || m.snippet || "" })
    });
    m.reply = data.reply.trim();
    flash("Draft ready — edit before sending");
  }catch(e){
    flash("Draft failed: "+e.message.slice(0,90));
  }finally{ busy=false; render(); }
}

async function saveReply(alsoArchive){
  const m = queue[cur]; if(!m) return;
  const ta = document.querySelector("textarea");
  const text = ta ? ta.value.trim() : "";
  if(!text){ flash("Nothing to send"); return; }
  m.reply = text;
  busy = true; render(); flash("Creating reply in Gmail…");
  try{
    await fetchAPI(`/api/thread/${m.threadId}/reply`, {
      method: 'POST',
      body: JSON.stringify({ messageId: m.messageId, addr: m.addr, subject: m.subject, text, archive: alsoArchive })
    });
    flash("Reply saved to Drafts" + (alsoArchive?" · thread archived":"") +
      ` — <a href="https://mail.google.com/mail/u/0/#drafts" target="_blank" rel="noopener">open Drafts to send</a>`, true);
    if(alsoArchive){ m.state="done"; busy=false; advance(); return; }
  }catch(e){
    flash("Failed: "+e.message.slice(0,100));
  }finally{ busy=false; render(); }
}

function render(){
  const r = el("reader"), m = queue[cur];
  const open = queue.filter(q=>q.state==="open");

  ["bArchive","bSkip","bP1"].forEach(id => el(id).disabled = !m || busy || loading);

  if(fatal){
    r.innerHTML = `<div class="center"><b>Couldn't reach Gmail API</b>
      <div class="sub">Please check your Google authentication connection.</div>
      <div class="err">${esc(fatal)}</div>
      <div style="display:flex;gap:10px">
        <button class="primary" onclick="window.location.href='/auth/google'">Authenticate with Google</button>
        <button class="primary" onclick="fatal=null;fetchBatch()">Try again</button>
      </div></div>`;
  } else if(loading && !m){
    r.innerHTML = `<div class="center"><div class="spin"></div><div class="sub">Pulling ${BATCH} threads from the inbox…</div></div>`;
  } else if(!batch){
    r.innerHTML = `<div class="center"><b>Ready to triage</b>
      <div class="sub">Pulls ${BATCH} inbox threads at a time, sorted P0 → P1 → newest. Refills automatically below ${REFILL_AT} left.</div>
      <button class="primary" onclick="fetchBatch()">Load inbox</button></div>`;
  } else if(!m){
    r.innerHTML = `<div class="center"><b>Queue clear</b>
      <div class="sub">Nothing left to triage in this session. Skipped threads stayed in the inbox.</div>
      <button class="primary" onclick="seen=new Set();queue=[];cur=0;batch=0;fetchBatch()">Reload inbox</button></div>`;
  } else {
    const tag = m.priority==="P0" ? `<span class="tag p0">P0</span>`
             : m.priority==="P1" ? `<span class="tag p1">P1</span>`
             : `<span class="tag none">UNRANKED</span>`;
    const bodyHTML = m.body!==null
      ? m.body.split(/\n{2,}/).map(p=>`<p>${esc(p)}</p>`).join("") +
        (m.truncated?`<p class="sys">— message truncated, open in Gmail for the rest —</p>`:"")
      : m.bodyError
        ? `<p class="sys">Couldn't load the message text. ${esc(m.bodyError.slice(0,120))}</p>`
        : `<div class="spin"></div>`;
    r.innerHTML = `
      <div class="meta">
        <div class="tagrow">${tag}${m.category?`<span class="tag cat">${esc(m.category)}</span>`:""}
          <span class="when">${esc(m.dateLabel||"")}</span></div>
        <h1 class="subject">${esc(m.subject||"(no subject)")}</h1>
        <div class="from"><b>${esc(m.from||"")}</b> &lt;${esc(m.addr||"")}&gt;
          <a href="https://mail.google.com/mail/u/0/#inbox/${encodeURIComponent(m.threadId)}" target="_blank" rel="noopener">open in Gmail ↗</a></div>
      </div>
      <div class="msg">${bodyHTML}</div>
      <div class="composer">
        <div class="head">REPLY
          <button class="chip" onclick="draftReply()" ${busy||m.body===null?"disabled":""}>Draft with Claude</button>
          <button class="chip" onclick="document.querySelector('textarea').focus()">Write my own</button>
        </div>
        <textarea id="ta" placeholder="Write a reply, or let Claude draft one in your voice…">${esc(m.reply||"")}</textarea>
        <div class="send">
          <button class="primary" onclick="saveReply(true)" ${busy?"disabled":""}>Reply &amp; archive</button>
          <button class="ghost" onclick="saveReply(false)" ${busy?"disabled":""}>Save draft only</button>
          <span class="hint">A archive · S skip · P make P1 · R reply</span>
        </div>
      </div>`;
    const ta = el("ta");
    if(ta) ta.addEventListener("input", e => { m.reply = e.target.value; });
  }

  el("rungs").innerHTML = queue.slice(0,40).map((q,i)=>{
    const cls = ["rung", q.priority==="P0"?"p0":q.priority==="P1"?"p1":"",
                 q.state!=="open"?"done":"", i===cur?"now":""].join(" ");
    return `<div class="${cls}"></div>`;
  }).join("");
  el("c0").textContent = open.filter(q=>q.priority==="P0").length;
  el("c1").textContent = open.filter(q=>q.priority==="P1").length;
  el("cr").textContent = open.filter(q=>!q.priority).length;
  el("cq").textContent = open.length;
  el("depth").textContent = open.length;
  el("left").textContent = open.length;
  el("loaded").textContent = queue.length;
  el("batch").textContent = batch;
}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

let ft;
function flash(msg, html){
  const f = el("flash");
  f[html?"innerHTML":"textContent"] = msg;
  f.classList.add("show");
  clearTimeout(ft); ft = setTimeout(()=>f.classList.remove("show"), html?7000:2200);
}
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="TEXTAREA" || e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if(k==="a") act("archive");
  if(k==="s") act("skip");
  if(k==="p") act("p1");
  if(k==="r"){ e.preventDefault(); el("ta")?.focus(); }
});
render();
</script>
</body>
</html>
